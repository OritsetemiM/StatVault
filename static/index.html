<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StatVault</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #080810;
      --surface:  #0f0f1a;
      --surface2: #16162a;
      --border:   #1e1e35;
      --accent:   #e8ff00;
      --accent2:  #7b5ea7;
      --text:     #e8e8f0;
      --muted:    #5a5a7a;
      --nfl:      #00c896;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 60px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }

    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .logo span { color: #fff; }

    .nav-links { display: flex; gap: 4px; }

    .nav-tab {
      color: var(--muted);
      text-decoration: none;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .nav-tab:hover { color: var(--text); }

    .nav-tab.active-nba {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(232, 255, 0, 0.06);
    }

    .nav-tab.active-nfl {
      color: var(--nfl);
      border-color: var(--nfl);
      background: rgba(0, 200, 150, 0.06);
    }

    /* HERO */
    .hero {
      padding: 80px 40px 50px;
      max-width: 700px;
    }

    .hero-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
      transition: color 0.3s;
    }

    .hero-eyebrow.nba { color: var(--accent); }
    .hero-eyebrow.nfl { color: var(--nfl); }

    .hero h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 20px;
    }

    .hero h1 em {
      font-style: normal;
      transition: color 0.3s;
    }

    .hero h1 em.nba { color: var(--accent); }
    .hero h1 em.nfl { color: var(--nfl); }

    .hero p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 480px;
    }

    /* SPORT BADGE */
    .sport-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 3px 10px;
      border-radius: 3px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .sport-badge.nba {
      background: rgba(232, 255, 0, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .sport-badge.nfl {
      background: rgba(0, 200, 150, 0.1);
      color: var(--nfl);
      border: 1px solid var(--nfl);
    }

    /* SEARCH */
    .search-section {
      padding: 0 40px 40px;
      position: relative;
      max-width: 800px;
    }

    .search-row {
      display: flex;
      gap: 0;
    }

    .search-row input {
      flex: 1;
      padding: 14px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 4px 0 0 4px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-row input::placeholder { color: var(--muted); }
    .search-row input:focus { border-color: var(--accent2); }

    .search-row button {
      padding: 14px 24px;
      color: #000;
      border: none;
      border-radius: 0 4px 4px 0;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .search-row button.nba { background: var(--accent); }
    .search-row button.nfl { background: var(--nfl); }
    .search-row button:hover { opacity: 0.85; }

    /* DROPDOWN */
    .search-dropdown {
      position: absolute;
      top: 52px;
      left: 0;
      right: 60px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      z-index: 200;
      display: none;
      max-height: 320px;
      overflow-y: auto;
    }

    .search-dropdown.visible { display: block; }

    .dropdown-item {
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover { background: var(--surface); }

    .dropdown-name {
      font-weight: 600;
      color: #fff;
      font-size: 0.95rem;
    }

    .dropdown-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .dropdown-stat {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      text-align: right;
    }

    .dropdown-stat.nba { color: var(--accent); }
    .dropdown-stat.nfl { color: var(--nfl); }

    .dropdown-stat span {
      font-size: 0.7rem;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
    }

    /* PROFILE */
    .profile {
      max-width: 1000px;
      margin: 0 40px 80px;
      display: none;
    }

    .profile.visible { display: block; }

    .profile-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 20px;
      overflow: visible;
    }

    .profile-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #fff;
      line-height: 1;
      white-space: nowrap;
      overflow: visible;
    }

    .profile-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .profile-pos {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 4px 12px;
      border-radius: 3px;
    }

    .profile-pos.nba {
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .profile-pos.nfl {
      color: var(--nfl);
      border: 1px solid var(--nfl);
    }

    /* CAREER BANNER */
    .career-banner {
      display: grid;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: visible;
      margin-bottom: 32px;
    }

    .career-stat {
      background: var(--surface);
      padding: 20px 16px;
      text-align: center;
    }

    .career-stat-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }

    .career-stat-value.nba { color: var(--accent); }
    .career-stat-value.nfl { color: var(--nfl); }

    .career-stat-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }

    /* SEASON TABLE */
    .season-table-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .season-table {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: visible;
    }

    .season-head {
      padding: 10px 20px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      display: grid;
    }

    .season-row {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      transition: background 0.15s;
      display: grid;
    }

    .season-row:last-child { border-bottom: none; }
    .season-row:hover { background: var(--surface); }

    .s-season {
      font-weight: 600;
      color: #fff;
      font-size: 0.9rem;
    }

    .s-team {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .s-stat {
      font-size: 0.9rem;
      color: var(--text);
      text-align: right;
    }

    .s-stat.best-nba { color: var(--accent); font-weight: 700; }
    .s-stat.best-nfl { color: var(--nfl); font-weight: 700; }

    /* TOOLTIP */
    .team-abbr {
      position: relative;
      cursor: default;
      border-bottom: 1px dashed var(--muted);
      display: inline-block;
    }

    .team-abbr::after {
      content: attr(data-full);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.75rem;
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      margin-top: 6px;
      z-index: 999;
    }

    .team-abbr:hover::after { opacity: 1; }

    /* EMPTY */
    .empty {
      padding: 60px 40px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px 40px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    footer a { color: var(--accent2); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<nav>
  <div class="logo">STAT<span>VAULT</span></div>
  <div class="nav-links">
    <div class="nav-tab active-nba" onclick="switchSport('nba')">NBA</div>
    <div class="nav-tab" onclick="switchSport('nfl')">NFL</div>
    <div class="nav-tab" onclick="">Compare</div>
  </div>
</nav>

<div class="hero">
  <div class="sport-badge nba" id="sportBadge">NBA</div>
  <p class="hero-eyebrow nba" id="heroEyebrow">Real data. Real players. Your database.</p>
  <h1>Built different.<br><em class="nba" id="heroEm">Proven by stats.</em></h1>
  <p id="heroSub">Search any NBA player and explore their full career — every season, every stat, all in one place.</p>
</div>

<div class="search-section" id="searchSection">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search a player... e.g. LeBron James, Anthony Edwards"/>
    <button class="nba" id="searchBtn" onclick="searchPlayers()">Search</button>
  </div>
  <div class="search-dropdown" id="searchDropdown"></div>
</div>

<div class="profile" id="profileSection"></div>
<div id="emptyState"></div>

<footer>
  Stats courtesy of
  <a href="https://www.basketball-reference.com" target="_blank">Basketball Reference</a>
  &nbsp;·&nbsp;
  <a href="https://www.pro-football-reference.com" target="_blank">Pro Football Reference</a>
  &nbsp;·&nbsp; Built by Temi Maku
</footer>

<script>
  // current sport mode
  let currentSport = 'nba';

  // NBA team name map
  const nbaTeams = {
    'ATL': 'Atlanta Hawks', 'BOS': 'Boston Celtics', 'BKN': 'Brooklyn Nets',
    'CHA': 'Charlotte Hornets', 'CHI': 'Chicago Bulls', 'CLE': 'Cleveland Cavaliers',
    'DAL': 'Dallas Mavericks', 'DEN': 'Denver Nuggets', 'DET': 'Detroit Pistons',
    'GSW': 'Golden State Warriors', 'HOU': 'Houston Rockets', 'IND': 'Indiana Pacers',
    'LAC': 'LA Clippers', 'LAL': 'Los Angeles Lakers', 'MEM': 'Memphis Grizzlies',
    'MIA': 'Miami Heat', 'MIL': 'Milwaukee Bucks', 'MIN': 'Minnesota Timberwolves',
    'NOP': 'New Orleans Pelicans', 'NYK': 'New York Knicks', 'OKC': 'Oklahoma City Thunder',
    'ORL': 'Orlando Magic', 'PHI': 'Philadelphia 76ers', 'PHX': 'Phoenix Suns',
    'POR': 'Portland Trail Blazers', 'SAC': 'Sacramento Kings', 'SAS': 'San Antonio Spurs',
    'TOR': 'Toronto Raptors', 'UTA': 'Utah Jazz', 'WAS': 'Washington Wizards',
    'TOT': 'Multiple Teams (traded)'
  };

  // NFL team name map
  const nflTeams = {
    'ARI': 'Arizona Cardinals', 'ATL': 'Atlanta Falcons', 'BAL': 'Baltimore Ravens',
    'BUF': 'Buffalo Bills', 'CAR': 'Carolina Panthers', 'CHI': 'Chicago Bears',
    'CIN': 'Cincinnati Bengals', 'CLE': 'Cleveland Browns', 'DAL': 'Dallas Cowboys',
    'DEN': 'Denver Broncos', 'DET': 'Detroit Lions', 'GNB': 'Green Bay Packers',
    'HOU': 'Houston Texans', 'IND': 'Indianapolis Colts', 'JAX': 'Jacksonville Jaguars',
    'KAN': 'Kansas City Chiefs', 'LAC': 'Los Angeles Chargers', 'LAR': 'Los Angeles Rams',
    'LVR': 'Las Vegas Raiders', 'MIA': 'Miami Dolphins', 'MIN': 'Minnesota Vikings',
    'NWE': 'New England Patriots', 'NOR': 'New Orleans Saints', 'NYG': 'New York Giants',
    'NYJ': 'New York Jets', 'PHI': 'Philadelphia Eagles', 'PIT': 'Pittsburgh Steelers',
    'SFO': 'San Francisco 49ers', 'SEA': 'Seattle Seahawks', 'TAM': 'Tampa Bay Buccaneers',
    'TEN': 'Tennessee Titans', 'WAS': 'Washington Commanders', '2TM': 'Multiple Teams',
    '3TM': 'Multiple Teams', '4TM': 'Multiple Teams'
  };

  // switch between NBA and NFL mode
  function switchSport(sport) {
    currentSport = sport;

    // update nav tabs
    document.querySelectorAll('.nav-tab').forEach(t => {
      t.classList.remove('active-nba', 'active-nfl');
    });

    if (sport === 'nba') {
      document.querySelectorAll('.nav-tab')[0].classList.add('active-nba');
      document.getElementById('sportBadge').className = 'sport-badge nba';
      document.getElementById('sportBadge').textContent = 'NBA';
      document.getElementById('heroEyebrow').className = 'hero-eyebrow nba';
      document.getElementById('heroEm').className = 'nba';
      document.getElementById('heroSub').textContent = 'Search any NBA player and explore their full career — every season, every stat, all in one place.';
      document.getElementById('searchInput').placeholder = 'Search a player... e.g. LeBron James, Anthony Edwards';
      document.getElementById('searchBtn').className = 'nba';
    } else {
      document.querySelectorAll('.nav-tab')[1].classList.add('active-nfl');
      document.getElementById('sportBadge').className = 'sport-badge nfl';
      document.getElementById('sportBadge').textContent = 'NFL';
      document.getElementById('heroEyebrow').className = 'hero-eyebrow nfl';
      document.getElementById('heroEm').className = 'nfl';
      document.getElementById('heroSub').textContent = 'Search any NFL player — QBs, RBs, WRs and TEs — full season stats and career breakdowns.';
      document.getElementById('searchInput').placeholder = 'Search a player... e.g. Patrick Mahomes, CeeDee Lamb';
      document.getElementById('searchBtn').className = 'nfl';
    }

    // clear results
    document.getElementById('searchInput').value = '';
    document.getElementById('searchDropdown').classList.remove('visible');
    document.getElementById('profileSection').classList.remove('visible');
    document.getElementById('profileSection').innerHTML = '';
  }

  // close dropdown when clicking outside
  document.addEventListener('click', e => {
    if (!document.getElementById('searchSection').contains(e.target)) {
      document.getElementById('searchDropdown').classList.remove('visible');
    }
  });

  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchPlayers();
  });

  async function searchPlayers() {
    const query = document.getElementById('searchInput').value.trim();
    const dropdown = document.getElementById('searchDropdown');
    if (!query) return;

    dropdown.innerHTML = '<div class="dropdown-item"><div class="dropdown-name" style="color:var(--muted)">Searching...</div></div>';
    dropdown.classList.add('visible');

    if (currentSport === 'nba') {
      await searchNBA(query, dropdown);
    } else {
      await searchNFL(query, dropdown);
    }
  }

  async function searchNBA(query, dropdown) {
    try {
      const res = await fetch(`/api/players?search=${encodeURIComponent(query)}`);
      const players = await res.json();

      if (!players || players.length === 0) {
        dropdown.innerHTML = '<div class="dropdown-item"><div class="dropdown-name" style="color:var(--muted)">No players found</div></div>';
        return;
      }

      // deduplicate by name
      const seen = {};
      const unique = players.filter(p => {
        if (seen[p.name]) return false;
        seen[p.name] = true;
        return true;
      });

      dropdown.innerHTML = unique.map(p => `
        <div class="dropdown-item" onclick="showNBAProfile('${p.name.replace(/'/g, "\\'")}')">
          <div>
            <div class="dropdown-name">${p.name}</div>
            <div class="dropdown-meta">${p.position} · <span class="team-abbr" data-full="${nbaTeams[p.team] || p.team}">${p.team}</span> · ${p.season}</div>
          </div>
          <div class="dropdown-stat nba">${p.points.toFixed(1)} <span>PPG</span></div>
        </div>
      `).join('');

    } catch (err) {
      dropdown.innerHTML = '<div class="dropdown-item"><div class="dropdown-name" style="color:var(--muted)">Error connecting to server</div></div>';
    }
  }

  async function searchNFL(query, dropdown) {
    try {
      // search all three NFL tables at once
      const [passingRes, rushingRes, receivingRes] = await Promise.all([
        fetch(`/api/nfl/passing?search=${encodeURIComponent(query)}`),
        fetch(`/api/nfl/rushing?search=${encodeURIComponent(query)}`),
        fetch(`/api/nfl/receiving?search=${encodeURIComponent(query)}`)
      ]);

      const [passing, rushing, receiving] = await Promise.all([
        passingRes.json(),
        rushingRes.json(),
        receivingRes.json()
      ]);

      // combine results and deduplicate by name
      const allPlayers = [];
      const seen = {};

      const addPlayers = (players, statKey, statLabel, unit) => {
        if (!players) return;
        for (const p of players) {
          if (!seen[p.name]) {
            seen[p.name] = true;
            allPlayers.push({ ...p, statKey, statLabel, unit });
          }
        }
      };

      addPlayers(passing, 'yards', 'YDS', '');
      addPlayers(rushing, 'yards', 'YDS', '');
      addPlayers(receiving, 'yards', 'YDS', '');

      if (allPlayers.length === 0) {
        dropdown.innerHTML = '<div class="dropdown-item"><div class="dropdown-name" style="color:var(--muted)">No players found</div></div>';
        return;
      }

      dropdown.innerHTML = allPlayers.map(p => {
      const types = Array.isArray(p.stat_types) ? p.stat_types : [];
      const typeBadges = types.map(t =>
        `<span style="font-size:0.65rem; padding:2px 6px; border-radius:3px; 
        background:rgba(0,200,150,0.15); color:var(--nfl); 
        border:1px solid var(--nfl); margin-left:4px">${t}</span>`
      ).join('');

      const statDisplay = p.stat_type === 'defense'
        ? `${p.sacks || 0} <span>SACKS</span>`
        : `${(p.yards || 0).toLocaleString()} <span>YDS</span>`;

      return `
        <div class="dropdown-item" onclick="showNFLProfile('${p.name.replace(/'/g, "\\'")}')">
          <div>
            <div class="dropdown-name">${p.name} ${typeBadges}</div>
            <div class="dropdown-meta">${p.position} · <span class="team-abbr" data-full="${nflTeams[p.team] || p.team}">${p.team}</span> · ${p.season}</div>
          </div>
          <div class="dropdown-stat nfl">${statDisplay}</div>
        </div>
      `;
    }).join('');

    } catch (err) {
      dropdown.innerHTML = '<div class="dropdown-item"><div class="dropdown-name" style="color:var(--muted)">Error connecting to server</div></div>';
    }
  }

  async function showNBAProfile(playerName) {
    document.getElementById('searchDropdown').classList.remove('visible');
    document.getElementById('searchInput').value = playerName;

    const profile = document.getElementById('profileSection');
    profile.innerHTML = '<div class="empty">Loading...</div>';
    profile.classList.add('visible');

    try {
      const res = await fetch(`/api/players?search=${encodeURIComponent(playerName)}`);
      const seasons = await res.json();

      if (!seasons || seasons.length === 0) {
        profile.innerHTML = '<div class="empty">No data found.</div>';
        return;
      }

      seasons.sort((a, b) => a.season.localeCompare(b.season));
      const p = seasons[0];

      // calculate career averages
      let tG = 0, tPts = 0, tAst = 0, tReb = 0, tStl = 0, tBlk = 0, tFg = 0, tFg3 = 0;
      for (const s of seasons) {
        tPts += s.points * s.games; tAst += s.assists * s.games;
        tReb += s.rebounds * s.games; tStl += s.steals * s.games;
        tBlk += s.blocks * s.games; tFg += s.fg_pct * s.games;
        tFg3 += s.three_pct * s.games; tG += s.games;
      }

      const avg = v => (v / tG).toFixed(1);
      const pct = v => ((v / tG) * 100).toFixed(1) + '%';
      const maxPts = Math.max(...seasons.map(s => s.points));

      profile.innerHTML = `
        <div class="profile-header">
          <div>
            <div class="profile-name">${p.name}</div>
            <div class="profile-sub">${seasons.length} season${seasons.length > 1 ? 's' : ''} · ${tG} games</div>
          </div>
          <span class="profile-pos nba">${p.position}</span>
        </div>

        <div class="career-banner" style="grid-template-columns: repeat(7, 1fr)">
          <div class="career-stat"><div class="career-stat-value nba">${avg(tPts)}</div><div class="career-stat-label"><span class="team-abbr" data-full="Points Per Game">PPG</span></div></div>
          <div class="career-stat"><div class="career-stat-value nba">${avg(tAst)}</div><div class="career-stat-label"><span class="team-abbr" data-full="Assists Per Game">APG</span></div></div>

async function showNFLProfile(playerName) {
  document.getElementById('searchDropdown').classList.remove('visible');
  document.getElementById('searchInput').value = playerName;

  const profile = document.getElementById('profileSection');
  profile.innerHTML = '<div class="empty">Loading...</div>';
  profile.classList.add('visible');

  try {
    const res = await fetch(`/api/nfl/profile?name=${encodeURIComponent(playerName)}`);
    const data = await res.json();

    if (!data || data.error) {
      profile.innerHTML = '<div class="empty">No data found.</div>';
      return;
    }

    // figure out which stat types this player has
    const availableTabs = [];
    if (data.passing && data.passing.length > 0) availableTabs.push('passing');
    if (data.rushing && data.rushing.length > 0) availableTabs.push('rushing');
    if (data.receiving && data.receiving.length > 0) availableTabs.push('receiving');
    if (data.defense && data.defense.length > 0) availableTabs.push('defense');

    // determine primary tab based on position
    let primaryTab = availableTabs[0] || 'passing';
    if (data.position === 'QB') primaryTab = 'passing';
    else if (['RB', 'FB'].includes(data.position)) primaryTab = 'rushing';
    else if (['WR', 'TE'].includes(data.position)) primaryTab = 'receiving';
    else if (['CB', 'S', 'LB', 'DE', 'DT', 'OLB', 'ILB', 'MLB', 'SS', 'FS', 'DB', 'DL', 'NT'].includes(data.position)) primaryTab = 'defense';

    // store data globally so tab switching works
    window.currentNFLData = data;
    window.currentNFLTabs = availableTabs;

    // render profile with tabs
    renderNFLProfile(data, availableTabs, primaryTab);

  } catch (err) {
    profile.innerHTML = '<div class="empty">Error loading profile.</div>';
  }
}

function renderNFLProfile(data, availableTabs, activeTab) {

          ${tabLabels[tab]}

        <div class="career-stat"><div class="career-stat-value nfl">${tG>0?(tYds/tG).toFixed(1):'—'}</div><div class="career-stat-label"><span class="team-abbr" data-full="Yards Per Game">Yds/G</span></div></div>
        <div class="career-stat"><div class="career-stat-value nfl">${seasons[seasons.length-1].rating.toFixed(1)}</div><div class="career-stat-label"><span class="team-abbr" data-full="Passer Rating">Rating</span></div></div>
      </div>
      <div class="season-table-title">Season by Season</div>
      <div class="season-table">
        <div class="season-head" style="grid-template-columns: 90px 70px 40px 80px 60px 50px 70px 70px 70px">
          <div>Season</div><div>Team</div><div>G</div>
          <div style="text-align:right">Yds</div><div style="text-align:right">TDs</div>
          <div style="text-align:right">INTs</div><div style="text-align:right">Cmp%</div>
          <div style="text-align:right">Yds/G</div><div style="text-align:right">Rating</div>
        </div>
        ${seasons.map(s => `
          <div class="season-row" style="grid-template-columns: 90px 70px 40px 80px 60px 50px 70px 70px 70px">
            <div class="s-season">${s.season}</div>
            <div class="s-team"><span class="team-abbr" data-full="${nflTeams[s.team]||s.team}">${s.team}</span></div>
            <div class="s-stat">${s.games}</div>
            <div class="s-stat ${s.yards===maxYds?'best-nfl':''}">${s.yards.toLocaleString()}</div>
            <div class="s-stat">${s.touchdowns}</div>
            <div class="s-stat">${s.interceptions}</div>
            <div class="s-stat">${s.comp_pct.toFixed(1)}%</div>
            <div class="s-stat">${s.yards_per_game.toFixed(1)}</div>
            <div class="s-stat">${s.rating.toFixed(1)}</div>
          </div>
        `).join('')}

    `;
  }

  else if (activeTab === 'rushing' && data.rushing) {
    const seasons = [...data.rushing].sort((a,b) => a.season.localeCompare(b.season));
    let tG=0, tYds=0, tTd=0, tAtt=0;
    for (const s of seasons) { tG+=s.games; tYds+=s.yards; tTd+=s.touchdowns; tAtt+=s.attempts; }
    const maxYds = Math.max(...seasons.map(s => s.yards));

    statHTML = `
      <div class="career-banner" style="grid-template-columns: repeat(5, 1fr); margin-bottom:16px">
        <div class="career-stat"><div class="career-stat-value nfl">${tYds.toLocaleString()}</div><div class="career-stat-label"><span class="team-abbr" data-full="Total Rushing Yards">Rush Yds</span></div></div>
        <div class="career-stat"><div class="career-stat-value nfl">${tTd}</div><div class="career-stat-label"><span class="team-abbr" data-full="Rushing Touchdowns">Rush TDs</span></div></div>
        <div class="career-stat"><div class="career-stat-value nfl">${tAtt}</div><div class="career-stat-label"><span class="team-abbr" data-full="Rushing Attempts">Attempts</span></div></div>
        <div class="career-stat"><div class="career-stat-value nfl">${tAtt>0?(tYds/tAtt).toFixed(1):'—'}</div><div class="career-stat-label"><span class="team-abbr" data-full="Yards Per Carry">Yds/Car</span></div></div>
        <div class="career-stat"><div class="career-stat-value nfl">${tG>0?(tYds/tG).toFixed(1):'—'}</div><div class="career-stat-label"><span class="team-abbr" data-full="Yards Per Game">Yds/G</span></div></div>
      </div>
      <div class="season-table-title">Season by Season</div>
      <div class="season-table">
        <div class="season-head" style="grid-template-columns: 90px 70px 40px 80px 70px 70px 70px 70px">
          <div>Season</div><div>Team</div><div>G</div>

          <div style="text-align:right">Att</div><div style="text-align:right">Yds/Car</div>
          <div style="text-align:right">Yds/G</div>
        </div>
        ${seasons.map(s => `
          <div class="season-row" style="grid-template-columns: 90px 70px 40px 80px 70px 70px 70px 70px">

            <div class="s-stat ${s.yards===maxYds?'best-nfl':''}">${s.yards.toLocaleString()}</div>
            <div class="s-stat">${s.touchdowns}</div>

  }

  else if (activeTab === 'receiving' && data.receiving) {
    const seasons = [...data.receiving].sort((a,b) => a.season.localeCompare(b.season));

    for (const s of seasons) { tG+=s.games; tYds+=s.yards; tTd+=s.touchdowns; tRec+=s.receptions; tTgt+=s.targets; }

    statHTML = `
      <div class="career-banner" style="grid-template-columns: repeat(6, 1fr); margin-bottom:16px">
        <div class="career-stat"><div class="career-stat-value nfl">${tYds.toLocaleString()}</div><div class="career-stat-label"><span class="team-abbr" data-full="Total Receiving Yards">Rec Yds</span></div></div>
        <div class="career-stat"><div class="career-stat-value nfl">${tTd}</div><div class="career-stat-label"><span class="team-abbr" data-full="Receiving Touchdowns">Rec TDs</span></div></div>
        <div class="career-stat"><div class="career-stat-value nfl">${tRec}</div><div class="career-stat-label"><span class="team-abbr" data-full="Total Receptions">Receptions</span></div></div>
        <div class="career-stat"><div class="career-stat-value nfl">${tTgt}</div><div class="career-stat-label"><span class="team-abbr" data-full="Total Targets">Targets</span></div></div>
        <div class="career-stat"><div class="career-stat-value nfl">${tRec>0?(tYds/tRec).toFixed(1):'—'}</div><div class="career-stat-label"><span class="team-abbr" data-full="Yards Per Reception">Yds/Rec</span></div></div>
        <div class="career-stat"><div class="career-stat-value nfl">${tG>0?(tYds/tG).toFixed(1):'—'}</div><div class="career-stat-label"><span class="team-abbr" data-full="Yards Per Game">Yds/G</span></div></div>
      </div>

      <div class="season-table">
        <div class="season-head" style="grid-template-columns: 90px 70px 40px 80px 60px 60px 70px 70px 70px">
          <div>Season</div><div>Team</div><div>G</div>

          <div style="text-align:right">Rec</div><div style="text-align:right">Tgt</div>
          <div style="text-align:right">Yds/R</div><div style="text-align:right">Yds/G</div>
        </div>
        ${seasons.map(s => `
          <div class="season-row" style="grid-template-columns: 90px 70px 40px 80px 60px 60px 70px 70px 70px">

    let tG=0, tSacks=0, tTackles=0, tInt=0, tPD=0, tFF=0;

          <div style="text-align:right">Forced Fum</div>
        </div>

          <div class="season-row" style="grid-template-columns: 90px 70px 40px 70px 70px 60px 70px 80px">

function switchNFLTab(tab) {
  // update button styles
  window.currentNFLTabs.forEach(t => {
    const btn = document.getElementById(`tab-${t}`);
    if (btn) {
      btn.style.background = t === tab ? 'var(--nfl)' : 'transparent';
      btn.style.color = t === tab ? '#000' : 'var(--nfl)';
    }
  });

  // re-render just the stat section
  const tempProfile = document.createElement('div');
  tempProfile.id = 'profileSection';
  tempProfile.className = 'profile visible';
  document.getElementById('profileSection').replaceWith(tempProfile);

  renderNFLProfile(window.currentNFLData, window.currentNFLTabs, tab);
}
