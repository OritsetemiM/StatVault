<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StatVault</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    nav {
      background: #111118;
      border-bottom: 2px solid #f04a00;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: #f04a00;
      letter-spacing: 2px;
    }

    .logo span { color: #ffffff; }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin-left: 24px;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover { color: #f04a00; }

    .hero {
      text-align: center;
      padding: 60px 20px 40px;
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .hero h1 span { color: #f04a00; }

    .hero p {
      color: #888;
      font-size: 1.1rem;
      margin-bottom: 36px;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 48px;
      padding: 0 20px;
    }

    .search-bar input {
      width: 100%;
      max-width: 480px;
      padding: 14px 20px;
      background: #1a1a24;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }

    .search-bar input:focus { border-color: #f04a00; }

    .search-bar button {
      padding: 14px 28px;
      background: #f04a00;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-bar button:hover { background: #d43e00; }

    .section-title {
      text-align: center;
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 24px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    .player-card {
      background: #111118;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 24px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .player-card:hover {
      border-color: #f04a00;
      transform: translateY(-4px);
    }

    .player-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .player-position {
      display: inline-block;
      background: #f04a00;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .player-team {
      color: #888;
      font-size: 0.9rem;
    }

    .message {
      text-align: center;
      color: #555;
      font-size: 1rem;
      padding: 60px 0;
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">STAT<span>VAULT</span></div>
    <div>
      <a href="#">NBA</a>
      <a href="#">NFL</a>
      <a href="#">Leaderboard</a>
    </div>
  </nav>

  <div class="hero">
    <h1>Sports Stats <span>Powered</span> by You</h1>
    <p>Search NBA and NFL players, stats, and more.</p>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search a player... e.g. LeBron, Mahomes" />
    <button onclick="searchPlayers()">Search</button>
  </div>

  <p class="section-title" id="sectionTitle">Enter a player name to search</p>

  <div class="players-grid" id="playersGrid">
    <p class="message" id="emptyMessage">No results yet — try searching above</p>
  </div>

  <script>
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') searchPlayers();
    });

    async function searchPlayers() {
      const query = document.getElementById('searchInput').value.trim();
      const grid = document.getElementById('playersGrid');
      const title = document.getElementById('sectionTitle');

      if (!query) return;

      grid.innerHTML = '<p class="message">Searching...</p>';
      title.textContent = `Searching for "${query}"...`;

      try {
        const res = await fetch(`/api/players?search=${encodeURIComponent(query)}`);
        const players = await res.json();

        if (players.length === 0) {
          grid.innerHTML = '<p class="message">No players found</p>';
          title.textContent = 'No results found';
          return;
        }

        title.textContent = `${players.length} result${players.length > 1 ? 's' : ''} found`;

        grid.innerHTML = players.map(p => `
          <div class="player-card">
            <div class="player-name">${p.first_name} ${p.last_name}</div>
            <div class="player-position">${p.position || 'N/A'}</div>
            <div class="player-team">${p.team.full_name}</div>
          </div>
        `).join('');

      } catch (err) {
        grid.innerHTML = '<p class="message">Error connecting to server</p>';
        title.textContent = 'Something went wrong';
      }
    }
  </script>

</body>
</html>
